spring.application.name=smart-email-assistant
server.port=8080

spring.ai.openai.api-key={your api key}


spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7


spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://mail.google.com,chrome-extension://*

app.email.max-length=20000
